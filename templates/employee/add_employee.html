<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة موظف</title>
</head>
<body>
    <div class="container">
        <h1>إضافة موظف جديد</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flashes">
            {% for category, message in messages %}
                <li class="{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('employee.add_employee') }}" method="post">
            <div class="form-group">
                <label for="username">اسم المستخدم:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="role">الدور:</label>
                <select id="role" name="role" required>
                    <option value="product_and_ads_manager">مدير المنتجات والإعلانات</option>
                    <option value="order_manager">مدير الطلبات</option>
                    <option value="seller_manager">مدير البائعين</option>
                </select>
            </div>
            <button type="submit">إضافة الموظف</button>
        </form>
    </div>
</body>
</html>
