<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الحساب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h3 class="mb-4 text-center">أدخل رمز التحقق</h3>
            
            <form action="{{ url_for('verify') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">رمز التحقق</label>
                    <input type="text" class="form-control" name="code" required>
                </div>
                <button type="submit" class="btn btn-success w-100">تحقق</button>
            </form>
        </div>
    </div>
</body>
</html>
