{% include 'header.html' %}


<div class="container my-4">
    <h1 class="text-center mb-4" style="font-size: 2.2rem; font-weight: 700; color: #333;">منتجاتنا</h1>
    <div class="row">
        {% for product in products %}
        <div class="col-6 col-md-6 col-lg-4 col-xl-3 mb-3">
            <div class="product-card card h-100">
                <!-- صورة المنتج -->
                <!-- تغيير سطر عرض الصورة في shop_users -->
                <img src="{{ url_for('static', filename=product.image.replace('static/', '')) }}"
                    alt="{{ product.name }}" class="card-img-top">
                <!-- تفاصيل المنتج -->
                <div class="card-body text-center">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <p class="price">ر.س {{ product.profit_price }}</p>

                    <!-- الأزرار -->
                    <div class="d-flex justify-content-center gap-2">
                        <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}"
                            class="d-inline">
                            <input type="hidden" name="name" value="{{ product.name }}">
                            <input type="hidden" name="price" value="{{ product.profit_price }}">
                            <input type="hidden" name="image" value="{{ product.image }}">
                            <input type="hidden" name="description" value="{{ product.description }}">
                            <input type="hidden" name="seller" value="{{ product.seller }}">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-shopping-cart"></i> إضافة للسلة
                            </button>
                        </form>
                        <a href="{{ url_for('product_details', product_id=product.id) }}"
                            class="btn btn-outline-secondary">
                            <i class="fa fa-info-circle"></i> تفاصيل
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% include 'f.html' %}
