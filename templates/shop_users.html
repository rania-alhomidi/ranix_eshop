{% include 'header.html' %}

<style>
    /* تحسينات عامة على الصفحة */
    body {
        background-color: #f8f9fa;
        font-family: 'Arial', sans-serif;
        
    }

    .product-card {
        transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
        border: none;
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
        margin-bottom: 15px;
    }

    .product-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
        height: 180px;
        object-fit: cover;
        width: 100%;
    }

    .product-card .card-body {
        padding: 1rem;
    }

    .product-card .card-title {
        font-size: 1.1rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 0.5rem;
    }

    .product-card .card-text {
        font-size: 0.85rem;
        color: #777;
        height: 50px;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 0.75rem;
    }

    .product-card .price {
        font-size: 1rem;
        font-weight: 600;
        color: #e74c3c;
        margin-bottom: 0.75rem;
    }

    .product-card .btn {
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
        border-radius: 20px;
        transition: background-color 0.3s ease-in-out, color 0.3s ease-in-out;
    }

    .product-card .btn-primary {
        background-color: #007bff;
        border: none;
    }

    .product-card .btn-primary:hover {
        background-color: #0056b3;
    }

    .product-card .btn-outline-secondary {
        border-color: #007bff;
        color: #007bff;
    }

    .product-card .btn-outline-secondary:hover {
        background-color: #007bff;
        color: #fff;
    }

    /* تحسينات للأجهزة الصغيرة */
    @media (max-width: 576px) {
        .product-card img {
            height: 150px;
        }

        .product-card .card-title {
            font-size: 1rem;
        }

        .product-card .card-text {
            font-size: 0.8rem;
            height: 40px;
        }

        .product-card .price {
            font-size: 0.9rem;
        }

        .product-card .btn {
            font-size: 0.75rem;
            padding: 0.4rem 0.6rem;
        }

        .container {
            padding-left: 10px;
            padding-right: 10px;
        }

        h1 {
            font-size: 2rem !important;
        }
    }
</style>

<div class="container my-4">
    <h1 class="text-center mb-4" style="font-size: 2.2rem; font-weight: 700; color: #333;">منتجاتنا</h1>
    <div class="row">
        {% for product in products %}
        <div class="col-6 col-md-6 col-lg-4 col-xl-3 mb-3">
            <div class="product-card card h-100">
                <!-- صورة المنتج -->
                <img src="{{ product.image }}" alt="{{ product.name }}" class="card-img-top">

                <!-- تفاصيل المنتج -->
                <div class="card-body text-center">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.description }}</p>
                    <p class="price">ر.س {{ product.profit_price }}</p>

                    <!-- الأزرار -->
                    <div class="d-flex justify-content-center gap-2">
                        <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}" class="d-inline">
                            <input type="hidden" name="name" value="{{ product.name }}">
                            <input type="hidden" name="price" value="{{ product.profit_price }}">
                            <input type="hidden" name="image" value="{{ product.image }}">
                            <input type="hidden" name="description" value="{{ product.description }}">
                            <input type="hidden" name="seller" value="{{ product.seller }}">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa fa-shopping-cart"></i> إضافة للسلة
                            </button>
                        </form>
                        <a href="{{ url_for('product_details', product_id=product.id) }}" class="btn btn-outline-secondary">
                            <i class="fa fa-info-circle"></i> تفاصيل
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% include 'f.html' %}
