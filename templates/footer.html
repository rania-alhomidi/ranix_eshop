
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --primary: #a30a7a;
        --primary-light: #e1bee7;
        --dark: #2c3e50;
        --light: #f8f9fa;
        --footer-bg: #ffffff;
        --footer-text: #5f6368;
        --active-color: #9c27b0;
        --shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Tajawal', sans-serif;
      
    }

    body {
        /* margin-bottom: 200px; */
        background-color: #f5f5f5;
        /* padding-bottom: 90px; */
    }

    .main-content{
        padding-bottom: 70px;
    }
    /* تصميم الفوتر العصري */
    .modern-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--footer-bg);
        display: flex;
        justify-content: space-around;
        align-items: center;
        padding: 15px 0;
        box-shadow: var(--shadow);
        z-index: 1000;
        border-radius: 25px 25px 0 0;
        border-top: 1px solid rgba(0,0,0,0.05);
    }

    .footer-item {
        text-align: center;
        color: var(--footer-text);
        text-decoration: none;
        transition: all 0.3s ease;
        position: relative;
        flex: 1;
        max-width: 25%;
    }

    .footer-item.active {
        color: var(--active-color);
    }

    .footer-icon {
        color:var(--primary);
        font-size: 22px;
        margin-bottom: 5px;
        transition: all 0.3s ease;
    }

    .footer-label {
        font-size: 12px;
        display: block;
        font-weight: 500;
        transition: all 0.3s ease;
    }

    .footer-item::before {
        content: '';
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 6px;
        background: var(--active-color);
        border-radius: 50%;
        opacity: 0;
        transition: all 0.3s ease;
    }

    .footer-item:hover {
        color: var(--active-color);
        transform: translateY(-5px);
    }

    .footer-item:hover .footer-icon {
        transform: scale(1.15);
    }

    .footer-item:hover::before {
        opacity: 1;
        top: -5px;
    }

    .footer-item.active::before {
        opacity: 1;
        top: -5px;
    }

    /* تأثيرات النقر */
    .footer-item:active {
        transform: scale(0.95);
    }

    /* تصميم للشاشات الصغيرة */
    @media (max-width: 480px) {
        .modern-footer {
            padding: 12px 0;
            border-radius: 20px 20px 0 0;
        }
        .footer-icon {
            font-size: 20px;
        }
        .footer-label {
            font-size: 11px;
        }
    }
</style>

<div class="main-content">
 
<!-- الفوتر العصري -->
<div class="modern-footer">
        
    <a href="{{ url_for('product.index') }}" class="footer-item active">
        <i class="fas fa-home footer-icon"></i>
        <span class="footer-label">الرئيسية</span>
    </a>
    
    <a href="{{ url_for('cart.view_cart') }}" class="footer-item">
        <i class="fas fa-shopping-cart footer-icon"></i>
        <span class="footer-label">السلة</span>
    </a>

    <a href="{{ url_for('user.wishlist') }}" class="footer-item">
        <i class="fas fa-heart footer-icon"></i>
        <span class="footer-label">المفضلة</span>
    </a>

    <a href="{{ url_for('user.profile') }}" class="footer-item">
        <i class="fas fa-user footer-icon"></i>
        <span class="footer-label">حسابي</span>
    </a>
    

    


</div>

<!-- مكتبات الجافاسكريبت -->
<script src="static/style/js/jquery-3.6.0.min.js"></script>
<script src="static/style/js/bootstrap.bundle.min.js"></script>
<script>
    // إضافة تأثير النشط عند النقر
    document.querySelectorAll('.footer-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.footer-item').forEach(i => {
                i.classList.remove('active');
            });
            this.classList.add('active');
        });
    });

    // تأثيرات إضافية
    document.querySelectorAll('.footer-item').forEach(item => {
        item.addEventListener('mouseenter', function() {
            this.querySelector('.footer-icon').style.transform = 'translateY(-5px)';
        });
        
        item.addEventListener('mouseleave', function() {
            this.querySelector('.footer-icon').style.transform = 'translateY(0)';
        });
    });
</script>
