<!-- footer.html -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="main-content">
 
<!-- الفوتر العصري -->
<div class="modern-footer">
        
    <a href="{{ url_for('product.index') }}" class="footer-item active">
        <i class="fas fa-home footer-icon"></i>
        <span class="footer-label">الرئيسية</span>
    </a>
    
    <a href="{{ url_for('cart.view_cart') }}" class="footer-item">
        <i class="fas fa-shopping-cart footer-icon"></i>
        <span class="footer-label">السلة</span>
    </a>

    <a href="{{ url_for('user.wishlist') }}" class="footer-item">
        <i class="fas fa-heart footer-icon"></i>
        <span class="footer-label">المفضلة</span>
    </a>

    <a href="{{ url_for('user.profile') }}" class="footer-item">
        <i class="fas fa-user footer-icon"></i>
        <span class="footer-label">حسابي</span>
    </a>
    

    


</div>

<!-- مكتبات الجافاسكريبت -->
<script src="static/style/js/jquery-3.6.0.min.js"></script>
<script src="static/style/js/bootstrap.bundle.min.js"></script>
<script>
    // إضافة تأثير النشط عند النقر
    document.querySelectorAll('.footer-item').forEach(item => {
        item.addEventListener('click', function() {
            document.querySelectorAll('.footer-item').forEach(i => {
                i.classList.remove('active');
            });
            this.classList.add('active');
        });
    });

    // تأثيرات إضافية
    document.querySelectorAll('.footer-item').forEach(item => {
        item.addEventListener('mouseenter', function() {
            this.querySelector('.footer-icon').style.transform = 'translateY(-5px)';
        });
        
        item.addEventListener('mouseleave', function() {
            this.querySelector('.footer-icon').style.transform = 'translateY(0)';
        });
    });
</script>
