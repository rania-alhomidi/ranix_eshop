<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <!-- إضافة روابط الـ CSS المطلوبة مثل Bootstrap أو أي مكتبات أخرى تحتاجها -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .product-card {
            margin-bottom: 30px;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .product-card .card-body {
            text-align: center;
        }
        .featured-badge {
            background-color: red;
            color: white;
            padding: 5px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center my-5">Product Grid</h1>
    <div class="row">
        {% for product in products %}
            <div class="col-md-12">
                <div class="card product-card">
                    <img src="{{ product.image }}" class="card-img-top" alt="{{ product.name }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text">{{ product.description }}</p>
                        <p><strong>Price:</strong> ${{ product.profit_price }}</p>
                        <!-- <p><del><strong>Original Price:</strong> ${{ product.original_price }}</del></p> -->
                        <p><strong>Category:</strong> {{ product.category }}</p>
                        <!-- <p><strong>Seller:</strong> {{ product.seller }}</p> -->
                        <!-- <p><strong>Address:</strong> {{ product.address }}</p> -->
                        
                        {% if product.featured %}
                            <span class="featured-badge">Featured</span>
                        {% endif %}

                        <a href="#" class="btn btn-primary">Add to Cart</a>
                    </div>
                </div>
            </div>
        {% else %}
            <div class="col-12">
                <p>No products available at the moment.</p>
            </div>
        {% endfor %}
    </div>
</div>

<!-- إضافة مكتبات JavaScript مثل jQuery و Bootstrap -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
