<!-- checkout.html -->
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إتمام الطلب</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">إتمام الطلب</h2>
        <form action="/checkout" method="post" class="mt-4">
            <div class="mb-3">
                <label class="form-label">الاسم الكامل</label>
                <input type="text" class="form-control" name="full_name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">العنوان</label>
                <input type="text" class="form-control" name="address" required>
            </div>
            <div class="mb-3">
                <label class="form-label">طريقة الدفع</label>
                <select class="form-control" name="payment_method">
                    <option value="cash">الدفع عند الاستلام</option>
                    <option value="credit_card">بطاقة الائتمان</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">إتمام الطلب</button>
        </form>
    </div>
</body>
</html>
