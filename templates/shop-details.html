{% include 'header.html' %}
<style>

    .product__details__pic__item{
        margin-top: 200px;
    }
</style>
<section class="product-details spad mt-5">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 col-md-6">
                <div class="product__details__pic">
                    <div class="product__details__pic__item">
                        <img class="product__details__pic__item--large"
                            src="{{ url_for('static', filename='uploads/' + product.image) }}" alt="{{ product.name }}">
                    </div>
                </div>
            </div>
            <div class="col-lg-6 col-md-6">
                <div class="product__details__text">
                    <h3>{{ product.name }}</h3>
                    <div class="product__details__price">السعر: {{ product.profit_price }} ر.ي</div>
                    <p>{{ product.description }}</p>

                    <ul>
                        <li><b>التوفر:</b> <span>{{ product.quantity }}</span></li>
                        <li><b>التصنيف:</b> <span>{{ product.category }}</span></li>
                        <li><b>البائع:</b> <span>{{ product.seller }}</span></li>
                        <li><b>الموقع:</b> <span>{{ product.address }}</span></li>
                    </ul>

                    <style>
                        .product__details__quantity {
                            display: flex;
                            align-items: center;
                            justify-content: space-between;
                            max-width: 200px;
                            /* margin: 10px 0; */
                        }
                        
                        .product__details__quantity button {
                            background-color: #ff6f61;
                            color: #fff;
                            border: none;
                            padding: 10px;
                            font-size: 16px;
                            cursor: pointer;
                            transition: background-color 0.3s ease;
                            border-radius: 5px;
                            width: 40px;
                            height: 40px;
                        }
                    
                        .product__details__quantity button:disabled {
                            background-color: #ddd;
                            cursor: not-allowed;
                        }
                    
                        .product__details__quantity button:hover {
                            background-color: #e04e43;
                        }
                    
                        .product__details__quantity input {
                            text-align: center;
                            font-size: 16px;
                            width: 50px;
                            padding: 8px;
                            border: 1px solid #ddd;
                            border-radius: 5px;
                            margin: 0 10px;
                        }
                    
                        .primary-btn {
                            background-color: #ffa4d6;
                            color: white;
                            padding: 12px 25px;
                            font-size: 18px;
                            border: none;
                            border-radius: 5px;
                            cursor: pointer;
                            transition: background-color 0.3s ease;
                            width: 100%;
                            margin-top: 20px;
                        }
                    
                        .primary-btn:hover {
                            background-color: #f5c3fd;
                        }
                    </style>
                    
                    <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}">
                        <input type="hidden" name="name" value="{{ product.name }}">
                        <input type="hidden" name="price" value="{{ product.profit_price }}">
                        <input type="hidden" name="image" value="{{ product.image }}"> <!-- إضافة رابط الصورة -->
                        <input type="hidden" name="description" value="{{ product.description }}"> <!-- إضافة الوصف -->
                        <input type="hidden" name="seller" value="{{ product.seller }}"> <!-- إضافة البائع -->
                        
                        <div class="product__details__quantity">
                            <button type="button" onclick="decreaseQuantity()">-</button>
                            <input type="text" id="quantity" name="quantity" value="1" readonly>
                            <button type="button" onclick="increaseQuantity()">+</button>
                        </div>
                        
                        <button type="submit" class="primary-btn">
                            <i class="fa fa-shopping-cart"></i> إضافة لسلة
                        </button>
                    </form>
                    
                    <script>
                    function increaseQuantity() {
                        let qty = document.getElementById('quantity');
                        qty.value = parseInt(qty.value) + 1;
                    }
                    
                    function decreaseQuantity() {
                        let qty = document.getElementById('quantity');
                        if (parseInt(qty.value) > 1) {
                            qty.value = parseInt(qty.value) - 1;
                        }
                    }
                    </script>
                    
                    
                </div>
            </div>
        </div>
    </div>
</section>
