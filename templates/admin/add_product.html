{% include 'admin/header.html' %}

<main id="main" class="main">
  <div class="container mt-5">
    <h1 class="text-center">إضافة منتج جديد</h1>
    <form  method="POST" enctype="multipart/form-data" class="mt-4 p-4 border rounded bg-light">
        <div class="mb-3">
            <label class="form-label">الاسم:</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الوصف:</label>
            <textarea name="description" class="form-control" required></textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">السعر الأصلي:</label>
            <input type="number" name="original_price" step="0.01" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">السعر بعد الربح:</label>
            <input type="number" name="profit_price" step="0.01" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الكمية:</label>
            <input type="number" name="quantity" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="image" class="form-label">الصورة:</label>
            <input type="file" name="image" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">الفئة الفرعية:</label>
            <select name="category" class="form-select" required>
                <option value="">اختر الفئة الفرعية</option>
                {% for category in categories %}
                    {% if category.parent_id %}  {# عرض الفئات الفرعية فقط #}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        

        
        
        <div class="mb-3">
            <label class="form-label">البائع:</label>
            <select name="seller" class="form-select" id="seller" onchange="fetchAddress()" required>
                <option value="">اختر البائع</option>
                {% for seller in sellers %}
                    <option value="{{ seller.id }}">{{ seller.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">العنوان:</label>
            <input type="text" id="address" name="address" class="form-control" >
        </div>
        
       
        
        <button type="submit" class="btn btn-primary">إضافة المنتج</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    function fetchAddress() {
        var sellerId = document.getElementById('seller').value;

        if (sellerId) {
            fetch('/get_address/' + sellerId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('address').value = data.address || 'لا يوجد عنوان';
                })
                .catch(error => {
                    console.error('Error fetching address:', error);
                    document.getElementById('address').value = 'حدث خطأ في جلب العنوان';
                });
        }
    }
  </script>
</main>

{% include 'admin/footer.html' %}
