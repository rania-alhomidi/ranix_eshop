{% include 'admin/header.html' %}

<main id="main" class="main">
  <div class="container mt-5">
    <h1 class="text-center">إضافة منتج جديد</h1>
    <form action="/add_product" method="POST" enctype="multipart/form-data" class="mt-4 p-4 border rounded bg-light">
        <div class="mb-3">
            <label class="form-label">الاسم:</label>
            <input type="text" name="name" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الوصف:</label>
            <textarea name="description" class="form-control" required></textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">السعر الأصلي:</label>
            <input type="number" name="original_price" step="0.01" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">السعر بعد الربح:</label>
            <input type="number" name="profit_price" step="0.01" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الكمية:</label>
            <input type="number" name="quantity" class="form-control" required>
        </div>
        
        <div class="mb-3">
            <label for="images" class="form-label">الصورة</label>
            <input type="file" name="image" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">الفئة:</label>
            <select name="category" class="form-select" required>
                {% for category in categories %}
                    <option value="{{ category.id }}">{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">البائع:</label>
            <select name="seller" class="form-select" required>
                {% for seller in sellers %}
                    <option value="{{ seller.seller_id }}">{{ seller.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">العنوان:</label>
            <select name="address" class="form-select" required>
                {% for address in addresses %}
                    <option value="{{ address.address_id }}">{{ address.street }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3 form-check">
            <input type="checkbox" name="featured" class="form-check-input">
            <label class="form-check-label">عرض المنتج في الواجهة</label>
        </div>
        
        <button type="submit" class="btn btn-primary">إضافة المنتج</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</main>

</body>
</html>
