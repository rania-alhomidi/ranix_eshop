{%include 'admin/header.html'%} 

<main id="main" class="main">
  <div class="container mt-5">
    <h1 class="text-center">تعديل المنتج</h1>
    <form method="POST" class="mt-4 p-4 border rounded bg-light">
        <div class="mb-3">
            <label class="form-label">اسم المنتج:</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الوصف:</label>
            <textarea name="description" class="form-control" required>{{ product.description }}</textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">السعر:</label>
            <input type="number" name="price" step="0.01" class="form-control" value="{{ product.price }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الكمية:</label>
            <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الفئة:</label>
            <select name="category" class="form-select" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if category.id == product.category_id %} selected {% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">البائع:</label>
            <select name="seller" class="form-select" required>
                {% for seller in sellers %}
                    <option value="{{ seller.seller_id }}" {% if seller.seller_id == product.seller_id %} selected {% endif %}>{{ seller.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">العنوان:</label>
            <select name="address" class="form-select" required>
                {% for address in addresses %}
                    <option value="{{ address.address_id }}" {% if address.address_id == product.address_id %} selected {% endif %}>{{ address.street }}</option>
                {% endfor %}
            </select>
        </div>
        
        <button type="submit" class="btn btn-warning">تعديل المنتج</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</main>
{%include 'footer.html'%}
