<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Dashboard - NiceAdmin Bootstrap Template</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="static/img/favicon.png" rel="icon">
  <link href="static/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Vendor CSS Files -->
  <link href="static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="static/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="static/vendor/quill/quill.snow.css" rel="stylesheet">
  <link href="static/vendor/quill/quill.bubble.css" rel="stylesheet">
  <link href="static/vendor/remixicon/remixicon.css" rel="stylesheet">
  <link href="static/vendor/simple-datatables/style.css" rel="stylesheet">
  <link rel="stylesheet" href="static/css/fontawesome.min.css"> 
  <link rel="stylesheet" href="static/css/fontawesome.css">
  <link rel="stylesheet" href="static/css/all.min.css"> 

  <!-- Template Main CSS File -->
  <link href="static/css/index.css" rel="stylesheet">

</head>

<body>
<main id="main" class="main">
  <div class="container mt-5">
    <h1 class="text-center">تعديل المنتج</h1>
    <form method="POST" enctype="multipart/form-data" class="mt-4 p-4 border rounded bg-light">
        <div class="mb-3">
            <label class="form-label">اسم المنتج:</label>
            <input type="text" name="name" class="form-control" value="{{ product.name }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الوصف:</label>
            <textarea name="description" class="form-control" required>{{ product.description }}</textarea>
        </div>
        
        <div class="mb-3">
            <label class="form-label">السعر الأصلي:</label>
            <input type="number" name="original_price" step="0.01" class="form-control" value="{{ product.original_price }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">السعر بعد الربح:</label>
            <input type="number" name="profit_price" step="0.01" class="form-control" value="{{ product.profit_price }}" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">الكمية:</label>
            <input type="number" name="quantity" class="form-control" value="{{ product.quantity }}" required>
        </div>
        
        <div class="mb-3">
            <label for="image" class="form-label">الصورة الحالية:</label>
            <img src="{{ url_for('static', filename=product.image) }}" alt="صورة المنتج" class="img-fluid mb-2" width="150">
            <input type="file" name="image" class="form-control">
        </div>
        
        <div class="mb-3">
            <label class="form-label">الفئة:</label>
            <select name="category" class="form-select" required>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if category.id == product.category_id %} selected {% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label class="form-label">البائع:</label>
            <select name="seller" class="form-select" id="seller" onchange="fetchAddress()" >
                <option value="">اختر البائع</option>
                {% for seller in sellers %}
                    <option value="{{ seller.id }}" {% if seller.id == product.seller_id %} selected {% endif %}>{{ seller.name }}</option>
                {% endfor %}
            </select>
        </div>
    
        <div class="mb-3">
            <label class="form-label">العنوان:</label>
            <input type="text" id="address" name="address" class="form-control" value="{{ product.address }}" readonly>
        </div>
        
      
        <button type="submit" class="btn btn-warning">تعديل المنتج</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    function fetchAddress() {
        var sellerId = document.getElementById('seller').value;

        if (sellerId) {
            fetch('/get_address/' + sellerId)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('address').value = data.address || 'لا يوجد عنوان';
                })
                .catch(error => {
                    console.error('Error fetching address:', error);
                    document.getElementById('address').value = 'حدث خطأ في جلب العنوان';
                });
        }
    }
  </script>
</main>
