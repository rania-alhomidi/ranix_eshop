<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال العناوين</title>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEDl43Oylmn4drWKGqRVu5wLiqadaQMBs&libraries=places"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        table { width: 80%; margin: 20px auto; border-collapse: collapse; }
        th, td { border: 1px solid black; padding: 10px; text-align: center; }
        form { margin: 20px auto; width: 50%; }
        input { width: 100%; padding: 10px; margin: 5px 0; }
        button { padding: 10px; cursor: pointer; }
        #map { height: 300px; width: 100%; margin: 10px auto; }
    </style>
</head>
<body>

    <h2>إدخال عنوان جديد</h2>
    <form action="/add" method="POST">
        <input type="number" name="user_id" placeholder="معرف المستخدم" required>
        <input type="text" id="latitude" name="latitude" placeholder="خط العرض" required readonly>
        <input type="text" id="longitude" name="longitude" placeholder="خط الطول" required readonly>
        <input type="text" id="address" name="address" placeholder="العنوان" required>
        <button type="button" onclick="getLocation()">📍 تحديد موقعي</button>
        <button type="submit">إضافة</button>
    </form>

    <div id="map"></div>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                alert("المتصفح لا يدعم تحديد الموقع.");
            }
        }

        function showPosition(position) {
            let lat = position.coords.latitude;
            let lng = position.coords.longitude;

            document.getElementById("latitude").value = lat;
            document.getElementById("longitude").value = lng;

            let map = new google.maps.Map(document.getElementById("map"), {
                center: { lat: lat, lng: lng },
                zoom: 15
            });

            let marker = new google.maps.Marker({
                position: { lat: lat, lng: lng },
                map: map
            });

            let geocoder = new google.maps.Geocoder();
            let latlng = { lat: lat, lng: lng };

            geocoder.geocode({ location: latlng }, function (results, status) {
                if (status === "OK") {
                    if (results[0]) {
                        document.getElementById("address").value = results[0].formatted_address;
                    }
                }
            });
        }

        function showError(error) {
            switch (error.code) {
                case error.PERMISSION_DENIED:
                    alert("تم رفض طلب تحديد الموقع.");
                    break;
                case error.POSITION_UNAVAILABLE:
                    alert("الموقع غير متاح.");
                    break;
                case error.TIMEOUT:
                    alert("انتهت مهلة طلب الموقع.");
                    break;
                case error.UNKNOWN_ERROR:
                    alert("حدث خطأ غير معروف.");
                    break;
            }
        }
    </script>

</body>
</html>
