<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدخال الأسعار</title>
</head>
<body>
    <h1>إدخال الأسعار للمنتج</h1>
    <form action="/add_price" method="POST">
        <label for="product_id">رقم المنتج:</label>
        <input type="number" id="product_id" name="product_id" required><br><br>

        <label for="original_price">السعر الأصلي:</label>
        <input type="number" step="0.01" id="original_price" name="original_price" required><br><br>

        <label for="profit_price">السعر بعد الربح:</label>
        <input type="number" step="0.01" id="profit_price" name="profit_price" required><br><br>

        <button type="submit">حفظ</button>
    </form>

    <br>
    <a href="/show_prices">عرض الأسعار</a>
</body>
</html>
