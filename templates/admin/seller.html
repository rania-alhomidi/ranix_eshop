{% include 'admin/header.html' %}

<main id="main" class="main">
    <div class="container mt-5">
        <h2 class="text-center">إضافة بائع جديد</h2>
        <form method="POST" class="m-3 p-3 border rounded bg-light" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">الاسم</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">اسم المتجر</label>
                <input type="text" name="store_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">صورة المتجر</label>
                <input type="file" name="store_image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">العنوان</label>
                <input type="text" name="address" class="form-control" required>
            </div>
            
            <!-- إضافة الخريطة -->
            <div class="mb-3">
                <label class="form-label">حدد موقعك</label>
                <div id="map" style="height: 400px; width: 100%;"></div>
                <button type="button" class="btn btn-info mt-2" onclick="getLocation()">استخدام الموقع الحالي</button>
            </div>

            <input type="hidden" name="latitude" id="latitude">
            <input type="hidden" name="longitude" id="longitude">

            <div class="mb-3">
                <label class="form-label">رقم الهاتف</label>
                <input type="text" name="phone_number" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">السجل التجاري</label>
                <input type="text" name="commercial_record" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">صورة الهوية</label>
                <input type="file" name="id_image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">الوثائق</label>
                <input type="file" name="documents" class="form-control" accept="application/pdf,image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">نوع المنتج</label>
                <input type="text" name="product_type" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">إضافة</button>
        </form>
    </div>
</main>

<script>
    function initMap() {
        // إعداد الخريطة المركزية
        var map = new google.maps.Map(document.getElementById('map'), {
            center: { lat: 21.4225, lng: 39.8262 }, // جدة كمثال
            zoom: 12
        });

        // تحديد مكان باستخدام علامة
        var marker = new google.maps.Marker({
            map: map,
            draggable: true,
            position: { lat: 21.4225, lng: 39.8262 }
        });

        google.maps.event.addListener(marker, 'position_changed', function() {
            var position = marker.getPosition();
            document.getElementById('latitude').value = position.lat();
            document.getElementById('longitude').value = position.lng();
        });
    }

    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                var latitude = position.coords.latitude;
                var longitude = position.coords.longitude;

                // نقل الموقع إلى الخريطة
                var map = new google.maps.Map(document.getElementById('map'), {
                    center: { lat: latitude, lng: longitude },
                    zoom: 12
                });

                var marker = new google.maps.Marker({
                    map: map,
                    draggable: true,
                    position: { lat: latitude, lng: longitude }
                });

                // تعيين القيم للحقول المخفية
                document.getElementById('latitude').value = latitude;
                document.getElementById('longitude').value = longitude;
            });
        } else {
            alert("الجهاز لا يدعم خاصية تحديد الموقع.");
        }
    }
</script>
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEDl43Oylmn4drWKGqRVu5wLiqadaQMBs&callback=initMap" async defer></script>

</body>
</html>
