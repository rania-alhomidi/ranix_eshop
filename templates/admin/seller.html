{% include 'admin/header.html' %}

<main id="main" class="main">
    <div class="container mt-5">
        <h2 class="text-center">إضافة بائع جديد</h2>
        <form method="POST" action="{{ url_for('admin.add_seller') }}" class="m-3 p-3 border rounded bg-light" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">الاسم</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">اسم المتجر</label>
                <input type="text" name="store_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">صورة المتجر</label>
                <input type="file" name="store_image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">حدد موقعك</label>
                <div id="map" style="height: 400px;"></div>
                <button type="button" id="getLocationButton" class="btn btn-info mt-2">استخدام الموقع الحالي</button>
                <p id="locationStatus" class="mb-0 mt-2 text-muted small"></p>
                <div class="form-group mt-3">
                    <label for="addressDisplay">العنوان</label>
                    <input type="text" class="form-control" id="addressDisplay" name="addressDisplay">
                </div>
                <input type="hidden" id="latitude" name="latitude">
                <input type="hidden" id="longitude" name="longitude">
            </div>
            <div class="mb-3">
                <label class="form-label">الرقم الأول:</label>
                <input type="number" name="number1" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">الرقم الثاني:</label>
                <input type="number" name="number2" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">السجل التجاري</label>
                <input type="text" name="commercial_record" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">صورة الهوية</label>
                <input type="file" name="id_image" class="form-control" accept="image/*">
            </div>
            <div class="mb-3">
                <label class="form-label">الوثائق</label>
                <input type="file" name="documents" class="form-control" accept="application/pdf,image/*">
            </div>
            <button type="submit" class="btn btn-primary w-100">إضافة</button>
        </form>
    </div>
</main>

<!-- Leaflet CSS and JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('map').setView([21.4225, 39.8262], 12);
    let marker = null;
    const getLocationButton = document.getElementById('getLocationButton');
    const locationStatus = document.getElementById('locationStatus');
    const latitudeInput = document.getElementById('latitude');
    const longitudeInput = document.getElementById('longitude');
    const addressDisplay = document.getElementById('addressDisplay');

    function initMap() {
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        map.on('click', onMapClick);
    }

    function onMapClick(e) {
        const { lat, lng } = e.latlng;
        updateLocation(lat, lng);
        reverseGeocode(lat, lng);
    }

    function onGetLocationClick() {
        if (navigator.geolocation) {
            locationStatus.textContent = '... جارِ الحصول على الموقع';
            navigator.geolocation.getCurrentPosition(onGeolocationSuccess, onGeolocationError);
        } else {
            locationStatus.textContent = 'تحديد الموقع الجغرافي غير مدعوم على هذا المتصفح.';
        }
    }

    async function reverseGeocode(lat, lng) {
        const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`;
        try {
            const response = await fetch(url);
            const data = await response.json();
            let address = data.display_name;
            addressDisplay.value = address || 'العنوان غير متوفر';
        } catch (error) {
            addressDisplay.value = 'لا يمكن استرجاع العنوان.';
        }
    }

    function onGeolocationSuccess(position) {
        const { latitude, longitude } = position.coords;
        updateLocation(latitude, longitude);
        reverseGeocode(latitude, longitude);
        locationStatus.textContent = '';
    }

    function onGeolocationError(error) {
        locationStatus.textContent = 'خطأ في الحصول على الموقع: ' + error.message;
    }

    function updateLocation(latitude, longitude) {
        latitudeInput.value = latitude;
        longitudeInput.value = longitude;
        if (marker) {
            map.removeLayer(marker);
        }
        marker = L.marker([latitude, longitude], {draggable: true}).addTo(map);
        marker.on('dragend', function(event) {
            const newLatLng = event.target.getLatLng();
            updateLocation(newLatLng.lat, newLatLng.lng);
            reverseGeocode(newLatLng.lat, newLatLng.lng);
        });
        map.setView([latitude, longitude], 15);
    }

    getLocationButton.addEventListener('click', onGetLocationClick);
    initMap();
});
</script>
