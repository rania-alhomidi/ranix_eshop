<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الفئة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">تعديل الفئة</h1>
        <form action="{{ url_for('edit_category', category_id=category.id) }}" method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">اسم الفئة</label>
                <input type="text" name="name" class="form-control" value="{{ category.name }}" required>
            </div>
            <div class="mb-3">
                <label for="parent" class="form-label">الفئة الرئيسية</label>
                <select name="parent" class="form-control">
                    <option value="">لا شيء</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" {% if cat.id == category.parent_id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="images" class="form-label">الصورة</label>
                <input type="file" name="images" class="form-control">
                {% if category.image %}
                    <p>الصورة الحالية:</p>
                    <img src="{{ url_for('static', filename=category.image) }}" alt="صورة الفئة" width="100">
                {% endif %}
            </div>
            <button type="submit" class="btn btn-success">حفظ التعديلات</button>
            <a href="{{ url_for('categories') }}" class="btn btn-secondary">إلغاء</a>
        </form>
    </div>
</body>
</html>
