<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>Dashboard - NiceAdmin Bootstrap Template</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="static/img/favicon.png" rel="icon">
  <link href="static/img/apple-touch-icon.png" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600i,700,700i|Nunito:300,300i,400,400i,600,600i,700,700i|Poppins:300,300i,400,400i,500,500i,600,600i,700,700i" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Vendor CSS Files -->
  <link href="static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="static/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">
  <link href="static/vendor/quill/quill.snow.css" rel="stylesheet">
  <link href="static/vendor/quill/quill.bubble.css" rel="stylesheet">
  <link href="static/vendor/remixicon/remixicon.css" rel="stylesheet">

  <link rel="stylesheet" href="static/css/fontawesome.min.css"> 
  <link rel="stylesheet" href="static/css/fontawesome.css">

  <!-- Template Main CSS File -->
  <link href="static/css/index.css" rel="stylesheet">

</head>

<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">تعديل الفئة</h1>
 

        <form method="POST" action="{{ url_for('admin.edit_category', category_id=category.id) }}" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="name" class="form-label">اسم الفئة</label>
                <input type="text" class="form-control" id="name" name="name" 
                       value="{{ category.name }}" required>
            </div>
            
            <div class="mb-3">
                <label for="parent" class="form-label">الفئة الرئيسية (اختياري)</label>
                <select class="form-select" id="parent" name="parent">
                    <option value="">-- لا يوجد --</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}" 
                            {% if cat.id == category.parent_id %}selected{% endif %}>
                            {{ cat.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="mb-3">
                <label for="image" class="form-label">صورة الفئة</label>
                <input class="form-control" type="file" id="image" name="image">
                
                {% if category.image %}
                    <div class="mt-2">
                        <p>الصورة الحالية:</p>
                        {% if category.image %}
    {% set category_image_path_no_static = category.image.replace('static/', '', 1) %}
    <img src="{{ url_for('static', filename=category_image_path_no_static) }}" alt="صورة الفئة" class="img-thumbnail" width="150">
{% endif %}
                    </div>
                {% endif %}
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <a href="{{ url_for('admin.categories') }}" class="btn btn-secondary me-md-2">إلغاء</a>
                <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% include 'admin/footer.html' %}
